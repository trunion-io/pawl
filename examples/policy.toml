# .pawl/policy.toml
#
# The thresholds are the client's, not the supplier's. The factory brings the
# mechanism and a defensible default; the bar it has to clear is set by the team
# that owns the service. A supplier that writes both the gate and the number it
# clears has built theatre.
#
# Commit this file to the client repo. Changes to it should be reviewed like any
# other change, because they are.

[gate]

# Comprehension has a hard ceiling regardless of trail quality. Start generous
# and ratchet down once the pod is decomposing work habitually.
max_changed_lines = 400

# Fraction of changed lines that may reach a human before the changeset is
# judged not worth reviewing incrementally. Above this, decompose or improve
# the trail — either is better than a reviewer skimming.
max_must_read_ratio = 0.35

# Changed code with no claim over it at all. Zero is the right default: silence
# from the agent is not coverage.
max_unclaimed_lines = 0

# An agent that could not establish something and proceeded anyway always
# escalates, whatever the tests say.
block_on_undetermined = true

# Paths where implicit coverage is not sufficient and a claim must cite a named
# check. Auth, billing, migrations, anything with a blast radius.
sensitive_paths = [
    "src/auth/",
    "src/billing/",
    "migrations/",
]

# Deterministic acknowledgement rules (PAWL-017). These decide what an agent is
# never asked to account for, so like the thresholds above they are yours and a
# change to them belongs in a reviewed diff.
#
# A rule may only ever say "there was nothing to assume here". It can never
# assert what was assumed — that needs a claimant.
[accounting]

# Paths whose changes carry nothing to assume. Trailing slash matches a prefix;
# anything else is matched as a glob.
auto_acknowledge_paths = [
    "vendor/",
    "*.pb.go",
    "go.sum",
]

# Acknowledge spans whose whitespace-normalised content is unchanged. Provable
# rather than heuristic: it reuses the same normalisation as claim fingerprints.
auto_acknowledge_formatting_only = true
