# PAWL-013 AC12 — the full check suite must pass before merge to main.
#
# Trunk-based development with a tool that gates other people's releases cannot
# tolerate a red main: there is no release branch to cut from instead.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # fmt, vet and the end-to-end suite. The tests run real git in temporary
      # repositories (C-9), so nothing extra is needed here.
      - run: make check

      # PAWL-011 AC11 and PAWL-013 AC11: builds must stay reproducible, and a
      # change that breaks that is a release blocker rather than a curiosity.
      - name: Reproducible build
        shell: bash
        run: |
          # Scratch goes outside the tree. Writing first.txt into the repo
          # root made the working tree dirty for the second build, and Go
          # stamped that difference into the binary — the check failed on its
          # own side effect.
          tmp="$(mktemp -d)"

          make dist VERSION=ci-check
          sha256sum dist/pawl-ci-check-linux-amd64 | awk '{print $1}' > "$tmp/first"
          rm -rf dist

          # Deliberately dirty the tree before the second build. Reproducibility
          # must be a property of the source, not of whether anything happens to
          # be uncommitted — a third party rebuilding a tag has no way to
          # guarantee the second condition, and one building from a tarball has
          # no VCS state at all.
          echo "scratch" > untracked-on-purpose.txt

          make dist VERSION=ci-check
          sha256sum dist/pawl-ci-check-linux-amd64 | awk '{print $1}' > "$tmp/second"
          rm -f untracked-on-purpose.txt

          if ! diff "$tmp/first" "$tmp/second"; then
            echo "builds are not reproducible"
            echo "embedded build settings:"
            go version -m dist/pawl-ci-check-linux-amd64 | grep -E 'build\s' || true
            exit 1
          fi
          echo "reproducible: $(cat "$tmp/first")"
