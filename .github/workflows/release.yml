# PAWL-013 — the release path.
#
# Every value in a published artifact derives from the tag and the tree. An
# operator typing a version, uploading a binary by hand, or signing locally
# would reintroduce exactly the gap AC6 closes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  id-token: write   # cosign keyless (AC10)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # AC7 needs the history to check reachability

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # AC6: the version comes from the tag and nowhere else.
      - name: Resolve version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # AC7: a tag that is not on main, or a dirty tree, is not a release.
      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main --depth=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag is not reachable from main; refusing to release"; exit 1; }
          [ -z "$(git status --porcelain)" ] \
            || { echo "working tree is not clean; refusing to release"; exit 1; }

      - name: Check
        run: make check

      - name: Build every platform
        run: make dist VERSION=${{ steps.v.outputs.version }}

      # AC9, and PAWL-011 AC9: execute what was built and confirm it reports the
      # version its own filename claims. The only check that closes the loop.
      - name: Verify the artifacts report their own version
        run: make verify-dist VERSION=${{ steps.v.outputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # AC10: keyless, bound to this workflow's identity. There is no key, so
      # there is no key to have leaked.
      - name: Sign each artifact
        run: |
          cd dist
          # PAWL-024 AC7. Signing only pawl-* left SHA256SUMS unsigned, and
          # SHA256SUMS is the file install.sh treats as authoritative — its
          # trust chain would have ended at transport security rather than at
          # this workflow's identity.
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Verify with cosign against this workflow's identity; see docs/install.md." \
            dist/*
