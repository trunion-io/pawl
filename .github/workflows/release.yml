# PAWL-013 — the release path. PAWL-027 — how the version is arrived at.
#
# Every value in a published artifact derives from the commit history and the
# tree. An operator typing a version, uploading a binary by hand, or signing
# locally would reintroduce exactly the gap PAWL-013 AC6 closes.
name: release

# PAWL-027 AC12 — the version is computed from the commits since the last
# release, not chosen. PAWL-013 AC6 forbade an operator typing a version into the
# build; a human deciding which tag to push is the same decision wearing a
# different hat, and this removes it. Dispatch means "release now", never
# "release this number".
#
# The tag is created here with GITHUB_TOKEN, whose pushes do not trigger further
# workflow runs, so this cannot re-enter itself.
on:
  workflow_dispatch:

permissions:
  contents: write   # create the tag and the release
  id-token: write   # cosign keyless (AC10)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # AC7 needs the history, and AC12 needs the commits

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # AC7: a commit that is not on main, or a dirty tree, is not a release.
      - name: Refuse anything that is not clean trunk
        run: |
          git fetch origin main --depth=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "not reachable from main; refusing to release"; exit 1; }
          [ -z "$(git status --porcelain)" ] \
            || { echo "working tree is not clean; refusing to release"; exit 1; }

      # PAWL-027 AC12–AC16. The bump table lives in internal/release and is
      # tested there, because its first row — a verdict-affecting change is
      # MAJOR whatever its type — is the row every off-the-shelf release tool
      # gets wrong, and getting it wrong ships a verdict change as a patch on
      # every release rather than occasionally.
      - name: Compute the version from commit history
        id: v
        run: go run ./internal/release/nextversion --notes-file release-notes.md

      # AC10 of PAWL-027: no version-affecting commits means there is nothing to
      # release. Failing here is deliberate — a dispatch that produces no release
      # should be visible, not silently green.
      - name: Nothing to release
        if: steps.v.outputs.release != 'true'
        run: |
          echo "no version-affecting commits since ${{ steps.v.outputs.previous_tag }}"
          echo "unconventional commits skipped: ${{ steps.v.outputs.unconventional }}"
          exit 1

      # AC15 is enforced in the tool, which refuses to compute a version that
      # already exists as a tag. The tagger identity is configured inside the
      # script, which is the only place a tag is written — see check-tagger.
      - name: Tag the release
        run: |
          .github/scripts/tag.sh "${{ steps.v.outputs.tag }}" "$GITHUB_SHA" \
            "${{ steps.v.outputs.tag }}" \
            "Bump: ${{ steps.v.outputs.bump }} from ${{ steps.v.outputs.previous }}"

      - name: Check
        run: make check

      - name: Build every platform
        run: make dist VERSION=${{ steps.v.outputs.version }}

      # AC9, and PAWL-011 AC9: execute what was built and confirm it reports the
      # version its own filename claims. The only check that closes the loop.
      - name: Verify the artifacts report their own version
        run: make verify-dist VERSION=${{ steps.v.outputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # AC10: keyless, bound to this workflow's identity. There is no key, so
      # there is no key to have leaked.
      - name: Sign each artifact
        run: |
          cd dist
          # PAWL-024 AC7. Signing only pawl-* left SHA256SUMS unsigned, and
          # SHA256SUMS is the file install.sh treats as authoritative — its
          # trust chain would have ended at transport security rather than at
          # this workflow's identity.
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file release-notes.md \
            dist/*
